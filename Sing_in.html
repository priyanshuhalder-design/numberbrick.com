<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <svg viewBox="0 0 75 24" width="75" height="24">
                    <path d="M7.05 10.5v2.1h5.35c-.15.93-.97 2.73-3.25 2.73-1.97 0-3.58-1.63-3.58-3.63s1.61-3.63 3.58-3.63c1.12 0 1.87.48 2.3 0.89l1.66-1.6c-1.06-.99-2.45-1.59-3.96-1.59-3.34 0-6.05 2.71-6.05 6.05s2.71 6.05 6.05 6.05c3.49 0 5.81-2.46 5.81-5.91 0-.4-.04-.71-.11-1.01H7.05z" fill="#4285F4"/>
                </svg>
            </div>
            
            <h2>Sign in</h2>
            <p class="subtitle">Use your Google Account</p>

            <form>
                <div class="input-group">
                    <input type="email" required>
                    <label>Email or phone</label>
                </div>
                
                <a href="https://myaccount.google.com/email?pli=1" class="forgot-link">Forgot email?</a>
                <p class="guest-text">Not your computer? Use Guest mode to sign in privately. <a href="https://grow.google/intl/en_in/ai-skills/">Learn more</a></p>
                
                <div class="actions">
                    <a href="https://support.google.com/accounts/answer/27441?hl=en&co=GENIE.Platform%3DAndroid" class="create-account">Create account</a>
                    <button type="button" class="btn-next"><a href="password.html">Next</a></button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
